<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470">
<rect width="1180" height="470" fill="#F7F5F0"/>
<text x="66" y="48" font-family="'HarmonyOS Sans SC',sans-serif" font-size="13" fill="#6B6660">七个环节由编排器以同一 trace_id 串联，每一步都留下可审计的痕迹</text>
<text x="66" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">01</text><text x="66" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">目标</text><text x="66" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">四条业务目标 · 13 项指标</text><text x="66" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">保销售 / 提效率 / 增会员 / 控风险</text><line x1="66" y1="100" x2="202" y2="100" stroke="#D9D3C9" stroke-width="1.4"/><path d="M202 100 l-7 -4 l0 8 z" fill="#D9D3C9"/><text x="216" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">02</text><text x="216" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">感知</text><text x="216" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">滚动中位数 + MAD 建基线</text><text x="216" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">连续 ≥2 天偏离即定位异常段</text><line x1="216" y1="100" x2="351" y2="100" stroke="#D9D3C9" stroke-width="1.4"/><path d="M351 100 l-7 -4 l0 8 z" fill="#D9D3C9"/><text x="365" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">03</text><text x="365" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">诊断</text><text x="365" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">九类假设并行验证</text><text x="365" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">证据 ≥2 条，输出根因 Top3</text><line x1="365" y1="100" x2="501" y2="100" stroke="#D9D3C9" stroke-width="1.4"/><path d="M501 100 l-7 -4 l0 8 z" fill="#D9D3C9"/><text x="515" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">04</text><text x="515" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">决策</text><text x="515" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">根因 × 打法库匹配</text><text x="515" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">约束检查 + ROI 估算</text><line x1="515" y1="100" x2="651" y2="100" stroke="#D9D3C9" stroke-width="1.4"/><path d="M651 100 l-7 -4 l0 8 z" fill="#D9D3C9"/><text x="665" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">05</text><text x="665" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">执行</text><text x="665" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">低风险自动 / 高风险转人工</text><text x="665" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">幂等写入，失败可补偿</text><line x1="665" y1="100" x2="801" y2="100" stroke="#D9D3C9" stroke-width="1.4"/><path d="M801 100 l-7 -4 l0 8 z" fill="#D9D3C9"/><text x="815" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">06</text><text x="815" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">治理</text><text x="815" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">执行前二次校验</text><text x="815" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">L3 审批 + 全链路审计</text><line x1="815" y1="100" x2="950" y2="100" stroke="#D9D3C9" stroke-width="1.4"/><path d="M950 100 l-7 -4 l0 8 z" fill="#D9D3C9"/><text x="964" y="118" font-family="'Noto Serif SC',serif" font-size="42" fill="#C0392B">07</text><text x="964" y="158" font-family="'HarmonyOS Sans SC',sans-serif" font-size="18" font-weight="700" fill="#17161A">评估</text><text x="964" y="192" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">因果模型推演 T+N</text><text x="964" y="214" font-family="'HarmonyOS Sans SC',sans-serif" font-size="12.5" fill="#6B6660">对比前后 7 天真实指标</text>
<line x1="66" y1="366" x2="1114" y2="366" stroke="#17161A" stroke-width="1.6"/>
<text x="66" y="400" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#17161A">治理不是事后合规，而是每一步的前置条件</text>
<text x="66" y="428" font-family="'HarmonyOS Sans SC',sans-serif" font-size="13" fill="#6B6660">写入前定风险等级 · 写入时幂等键与 dry-run 预演 · 写入后审计留痕、失败可补偿；Agent 服务身份硬上限 L2</text>
<text x="1114" y="428" font-family="Cascadia Mono,monospace" font-size="12" fill="#8A8175" text-anchor="end">TRACE_ID / 全链路</text>
</svg>