<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零售经营决策 Agent</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="drawer-mask" id="drawer-mask"></div>

<div class="flex">

  <!-- 侧栏 -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/overview">
      <span class="brand-mark">R</span>
      <span class="brand-text">零售经营决策<small>Agent Console</small></span>
    </a>
    <nav class="nav">
      <span class="nav-group">经营</span>
      <a href="#/overview" data-page="overview">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>经营总览</a>
      <a href="#/anomalies" data-page="anomalies">
        <svg viewBox="0 0 24 24"><path d="M12 3L2.5 20h19L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.5v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.8" r=".9" fill="currentColor"/></svg>异常中心<span class="count" id="badge-anomaly"></span></a>
      <a href="#/decisions" data-page="decisions">
        <svg viewBox="0 0 24 24"><path d="M9 21h6M10 17.5h4M12 3a6 6 0 0 0-3.4 10.9c.9.7 1.4 1.3 1.4 2.1h4c0-.8.5-1.4 1.4-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>补货 / 促销建议<span class="count warn" id="badge-decision"></span></a>
      <span class="nav-group">执行与治理</span>
      <a href="#/approvals" data-page="approvals">
        <svg viewBox="0 0 24 24"><path d="M12 2l8 3.5v5.7c0 5-3.4 8.6-8 10.8-4.6-2.2-8-5.8-8-10.8V5.5L12 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12l2.4 2.4 4.6-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>审批中心<span class="count warn pulse" id="badge-approval"></span></a>
      <a href="#/executions" data-page="executions">
        <svg viewBox="0 0 24 24"><path d="M6 4l13 8-13 8V4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>执行记录</a>
      <a href="#/audit" data-page="audit">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6V2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12h7M9 16h7M9 8h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>审计日志</a>
    </nav>
    <div class="sidebar-foot">
      <label class="role-label">当前身份</label>
      <select id="role-select">
        <option value="tok_risk_01">风控审批人（L3）</option>
        <option value="tok_planner_01">供应链计划员（L2）</option>
        <option value="tok_member_01">会员运营（L2）</option>
        <option value="tok_region_01">区域经理（L2）</option>
        <option value="tok_store_01">门店店长（L2）</option>
        <option value="tok_hq_01">总部运营（L2）</option>
      </select>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main-col">

    <header class="topbar">
      <button class="btn ghost burger" id="burger" title="菜单">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="crumbs">
        <span class="crumb">零售经营决策</span><span class="crumb-sep">/</span>
        <span class="crumb strong" id="crumb-page">经营总览</span>
        <span class="crumb-meta" id="biz-date"></span>
      </div>
      <div class="flow-pills" title="Agent 工作流程">
        <span>自动发现</span><i>→</i><span>根因分析</span><i>→</i><span>补货/促销建议</span><i>→</i><span>授权执行</span>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" onclick="route()" title="刷新">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="btn ghost" id="btn-scan" onclick="runScan(this)">▶ 扫描异常</button>
        <button class="btn primary" id="btn-pipeline" onclick="runPipeline(this)">⚡ 运行 Agent</button>
      </div>
    </header>

    <main id="main" class="page"><div class="loading"><div class="spin-ring"></div>加载中…</div></main>

    <footer class="footer-note">
      零售经营决策 Agent · 接入门店 / 会员 / 供应链 / 客服系统 · 自动发现销量异常 → 根因分析 → 补货/促销建议 → 授权执行
    </footer>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
